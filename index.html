<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teen IT Day.</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="registration">
    <div class="conteiner">
        <div class="info">
        <h1 class="text__info">Teen IT Day</h1>
        <p class="submit__info">Реєстрація на IT команду для підлітків які хочуть себе спробувати
            у програмуванні
        </p>
            <ul class="info__list">
                <li class="info__li">15 листопада</li>
                <li class="info__li">9:00-20:00</li>
                <li class="info__li">Онлайн</li>
            </ul>
        </div>
        <form class="form">
    <div class="form__container">
        <input type="text" id="name" class="form__input">
        <label for="name">Імя</label>
    </div>
    <div class="form__container">
        <input type="email" id="gmail" class="form__input">
        <label for="gmail">email</label>
    </div>
    <div class="form__container">
        <select id="track" class="form__select">
            <option value="">Оберіть варіант</option>
            <option value="design">Дезайн</option>
            <option value="frontend">Фронтенд розробник</option>
            <option value="qa">QA тестувальник</option>
        </select>
        <label for="track">Оберіть напрям</label>
    </div>
    <label class="form__agree">
        <input type="checkbox">
        <span>Я погоджуюся з правилами</span>
    </label>
    <button type="submit" class="btn">Заєструватися</button>
</form>
    </div>
    </section>
</body>
</html>
